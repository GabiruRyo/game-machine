    - Próxima!
    - Presta atenção agora.
    - Essa é boa.
  correct:
    - Essa foi fácil, né?
    - Isso aí!
    - Certíssimo.
    - Alguém andou estudando.
  correctHard:
    - Essa era pra derrubar geral.
    - Respeito. Essa era difícil.
    - Olha o nível dessa resposta.
    - Quem estudou, estudou.
  wrongHard:
    - Essa era cruel, admito.
    - Ninguém acertaria essa.
    - Dessa vez não dá pra culpar você.
  wrong:
    - Passou longe.
    - Não foi dessa vez.
    - Doeu só de ver.
    - A sala inteira sabia.
  timeout:
    - O tempo não perdoa.
    - Ficou pensando demais.
    - Zero pontos por indecisão.
  gameEnd:
    - Acabou. Contem os estragos.
    - E o placar não mente.
    - Fim de jogo.
