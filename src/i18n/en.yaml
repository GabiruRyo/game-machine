setup:
  title: Who's playing?
  addPlayer: Add player
  namePlaceholder: Player name
  remove: Remove
  start: Start
  hint: "Players can also be set in data/config.yaml."

games:
  quiz:
    name: Quiz Blitz
    tagline: Answer fast, score big
    rules: "Each player answers on their turn. The faster the answer, the more it's worth. Miss it and the next player can steal."
    stealTurn: "Steal! {name}'s turn"
  ordem:
    name: Line 'Em Up
    tagline: Put it all in order
    rules: "The whole room argues it out and drops the items into the right order. Every correct slot scores."
    correctOrder: "Correct order"
  lorota:
    name: Fact or Fake
    tagline: One of these is invented
    rules: "Three statements, one is a lie. The turn player picks — and the room is free to talk them into the wrong one."
    findTheLie: "Which one is invented?"
  quemdiria:
    name: Who Would
    tagline: How well do you know this lot?
    rules: "The turn player guesses who the room would vote for. The room votes with a show of hands."
    predictTurn: "{name} predicts"
    predictHint: "Who will the room vote for?"
    roomVotes: "Room vote"
    enterResult: "Everyone points at once. Enter who the room picked."
    predicted: "Predicted"
    roomChose: "The room chose"
  proibida:
    name: Taboo Rush
    tagline: Describe it without saying it
    rules: "The word shows on screen for everyone except the guesser, who turns their back. The room describes it without using the forbidden words."
    guesserIs: "Guesser"
    turnAround: "{name}, turn your back and don't look at the screen!"
    roomDescribes: "Everyone else describes the word without using any of the forbidden ones."
    dontSay: "Don't say"
    hits: Hits
    skipsLeft: "Skips left"
    keyHit: "Space — got it"
  tribunal:
    name: Kangaroo Court
    tagline: Defend the indefensible
    rules: "Two players are handed opposite sides of an absurd motion and a ticking clock. The room delivers the verdict."
    theMotion: "The motion"
    sideFor: "For"
    sideAgainst: "Against"
    for: "For ({name})"
    against: "Against ({name})"
    curveball: "Curveball!"
    keyDone: "Space — I'm done"
    roomVerdict: "The room decides: who argued it better?"
    voterTurn: "{name} votes"
  historias:
    name: Mad Tales
    tagline: You have no idea what you're writing
    rules: "The app asks for stray words without showing the story. Then it reads the damage out loud."
    wordCount: "Word {current} of {total}"
    noPeeking: "Nobody has seen the story yet — not even the person typing."
    theStory: "The story"
    pickFavourite: "Which word wrecked the story?"
    favouriteWas: "Best word"
  legendas:
    name: Caption This
    tagline: Funniest line takes it
    rules: "Everyone writes a caption for the same absurd setup. Then the room votes for the best one."
    setup: "The setup"
    yourCaption: "Write your caption"
    placeholder: "Go on then..."
    voteTurn: "{name} votes for the best (not your own)"

party:
  leg: "Game {current} of {total}"
  finale: "GRAND FINALE — worth {multiplier}x"
  standings: "Where things stand"

host:
  welcome:
    - Let's get this mess started.
    - The machine is warm. Who's first?
    - Ready your arguments and your excuses.
  roundStart:
    - Here we go.
    - Next one!
    - Pay attention now.
    - Oh, this one's good.
  correct:
    - That was an easy one, right?
    - There it is!
    - Spot on.
    - Someone has been studying.
  correctHard:
    - That one was built to catch people out.
    - Respect. That was a hard one.
    - Look at the level of that answer.
    - Someone clearly did the reading.
  wrongHard:
    - That one was cruel, I admit it.
    - Nobody was getting that.
    - You can't be blamed for that one.
  wrong:
    - Not even close.
    - Not this time.
    - That hurt to watch.
    - The whole room knew that one.
  timeout:
    - The clock shows no mercy.
    - Overthought it.
    - Zero points for indecision.
  gameEnd:
    - That's it. Count the damage.
    - And the scoreboard never lies.
    - Game over.
