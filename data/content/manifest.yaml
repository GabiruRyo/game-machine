  - { id: quemdiria-core-pt, game: quemdiria, lang: pt-BR, file: quemdiria/core.pt-BR.yaml, title: "Perguntas sobre a turma", auto: true }
  - { id: quemdiria-core-en, game: quemdiria, lang: en,    file: quemdiria/core.en.yaml,    title: "Questions about the room", auto: true }
  - { id: tribunal-core-pt,  game: tribunal,  lang: pt-BR, file: tribunal/core.pt-BR.yaml,  title: "Teses e reviravoltas",  auto: true }
  - { id: tribunal-core-en,  game: tribunal,  lang: en,    file: tribunal/core.en.yaml,     title: "Motions and curveballs",auto: true }
