# Every content pack the app can load. Add a file, add a line here, done.
# `auto: true` means it loads when config.yaml has `content.packs: [auto]`.
packs:
  - { id: quiz-core-pt,     game: quiz, lang: pt-BR, file: quiz/core.pt-BR.yaml,     title: "Conhecimentos gerais", auto: true }
  - { id: quiz-core-en,     game: quiz, lang: en,    file: quiz/core.en.yaml,        title: "General knowledge",    auto: true }
  - { id: quiz-brasil,      game: quiz, lang: pt-BR, file: quiz/brasil.pt-BR.yaml,   title: "Brasil",               auto: true }
  - { id: quiz-anglo,       game: quiz, lang: en,    file: quiz/anglo.en.yaml,       title: "English-speaking pop", auto: true }
  - { id: ordem-core-pt,    game: ordem,    lang: pt-BR, file: ordem/core.pt-BR.yaml,    title: "Sequências essenciais", auto: true }
  - { id: ordem-core-en,    game: ordem,    lang: en,    file: ordem/core.en.yaml,       title: "Core sequences",        auto: true }
  - { id: lorota-core-pt,   game: lorota,   lang: pt-BR, file: lorota/core.pt-BR.yaml,   title: "Verdades e invenções",  auto: true }
  - { id: lorota-core-en,   game: lorota,   lang: en,    file: lorota/core.en.yaml,      title: "Facts and fabrications",auto: true }
