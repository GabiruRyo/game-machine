  - { id: ordem-core-en,    game: ordem,    lang: en,    file: ordem/core.en.yaml,       title: "Core sequences",        auto: true }
  - { id: lorota-core-pt,   game: lorota,   lang: pt-BR, file: lorota/core.pt-BR.yaml,   title: "Verdades e invenções",  auto: true }
